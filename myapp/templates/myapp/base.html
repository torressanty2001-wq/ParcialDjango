<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Programas{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; color: #222; }
        header { background: #1f3a5f; color: #fff; padding: 1rem 2rem; }
        main { max-width: 600px; margin: 2rem auto; background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input[type=text] { width: 100%; padding: .5rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: .6rem 1.2rem; background: #1f3a5f; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
        .success { background: #d4edda; padding: .7rem; border-radius: 4px; margin-bottom: 1rem; }
        .errorlist { color: #b00020; margin: .3rem 0 0; padding-left: 1rem; }
    </style>
</head>
<body>
    <header><h1>{% block header %}Gestión de programas{% endblock %}</h1></header>
    <main>
        {% if messages %}
            {% for message in messages %}<div class="success">{{ message }}</div>{% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
